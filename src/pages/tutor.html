<section id="app-tutor" class="app-module hidden p-4 md:p-8 overflow-hidden">
  <div class="max-w-3xl mx-auto w-full flex flex-col h-full">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-textMain">AI Tutor</h2>
        <p class="text-xs text-textMuted">Ask anything. Cites your own notes when relevant.</p>
      </div>
      <div class="flex gap-2">
        <button onclick="tutorClear()" class="text-xs text-textMuted hover:text-red-400 px-3 py-1.5 border border-borderDark rounded-lg">Clear</button>
        <div class="csel" onclick="event.stopPropagation()">
            <select id="tutor-mode" class="hidden">
                <option value="explain">Explain</option><option value="quiz">Quiz me</option>
                <option value="summarize">Summarize notes</option><option value="socratic">Socratic</option>
            </select>
            <button id="tutor-mode-btn" class="csel-btn sm" onclick="cselToggle('tutor-mode',event)">
                <span class="csel-label">Explain</span>
                <svg class="csel-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l4 4 4-4"/></svg>
            </button>
            <div id="tutor-mode-dd" class="csel-dropdown">
                <div class="csel-option selected" data-val="explain"   onclick="cselChoose('tutor-mode','explain','Explain')">Explain</div>
                <div class="csel-option"          data-val="quiz"      onclick="cselChoose('tutor-mode','quiz','Quiz me')">Quiz me</div>
                <div class="csel-option"          data-val="summarize" onclick="cselChoose('tutor-mode','summarize','Summarize notes')">Summarize notes</div>
                <div class="csel-option"          data-val="socratic"  onclick="cselChoose('tutor-mode','socratic','Socratic')">Socratic</div>
            </div>
        </div>
      </div>
    </div>
    <div id="tutor-thread" class="flex-1 overflow-y-auto flex flex-col gap-3 p-4 glass-sidebar border border-borderDark rounded-xl"></div>
    <div class="mt-3 flex gap-2">
      <textarea id="tutor-input" rows="2" placeholder="Ask about your notes, a concept, or paste a problem..." class="flex-1 bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-sm text-textMain outline-none focus:border-accent resize-none"></textarea>
      <button onclick="tutorSend()" class="px-5 bg-accent text-white font-bold rounded-lg hover:opacity-90 transition self-stretch">Send</button>
    </div>


    <p class="text-[10px] text-textMuted mt-2">Powered by Pollinations.ai (free, no key). Responses can be wrong — verify against sources.</p>
  </div>
</section>
