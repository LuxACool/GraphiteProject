<section id="app-sessions" class="app-module hidden p-4 md:p-8 overflow-y-auto">
    <div class="max-w-4xl mx-auto w-full pb-20 space-y-6">
        <div class="flex items-start justify-between flex-wrap gap-4">
            <div>
                <h2 class="text-xl md:text-2xl font-bold text-textMain">Study Session Log</h2>
                <p class="text-sm text-textMuted mt-1">Every completed Pomodoro logged by subject. See exactly where your time goes.</p>
            </div>
            <button onclick="addManualSession()" class="px-4 py-2 glass-sidebar border border-borderDark text-textMain text-sm font-medium rounded-lg hover:bg-black/20">+ Log Manually</button>
        </div>

        <!-- Subject breakdown bars -->
        <div class="glass-sidebar border border-borderDark rounded-xl p-5 shadow-sm">
            <h3 class="text-sm font-semibold text-textMain mb-4">Weekly Subject Breakdown</h3>
            <div id="session-weekly-bars" class="space-y-3"></div>
            <div id="session-weekly-empty" class="hidden text-sm text-textMuted italic">No sessions this week. Complete a tagged Pomodoro to start tracking.</div>
        </div>

        <!-- All sessions table -->
        <div class="glass-sidebar border border-borderDark rounded-xl overflow-hidden shadow-sm">
            <div class="p-4 border-b border-borderDark flex items-center justify-between gap-3 flex-wrap">
                <h3 class="text-sm font-semibold text-textMain">All Sessions</h3>
                <input type="text" id="session-filter" oninput="renderSessionLog()" placeholder="Filter by subject..." class="bg-bgDark border border-borderDark rounded-lg px-3 py-1.5 text-sm text-textMain outline-none focus:border-accent w-48">
            </div>
            <div id="session-log-table" class="divide-y divide-borderDark max-h-[50vh] overflow-y-auto"></div>
        </div>
    </div>
</section>
