name: "Publish Release"

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever you push a tag like v1.0.0

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: ""
            args: ""
          - platform: "windows-latest"
            target: ""
            args: ""
          - platform: "ubuntu-22.04"
            target: "aarch64-linux-android"
            args: "--target aarch64-linux-android"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (Linux Desktop only)
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
        
      - name: setup Android OpenJDK (Android only)
        if: matrix.target == 'aarch64-linux-android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK & NDK (Android only)
        if: matrix.target == 'aarch64-linux-android'
        id: setup-android
        uses: android-actions/setup-android@v3

      - name: install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-android.outputs.ANDROID_NDK_HOME }}
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.ANDROID_NDK_HOME }}
          # Force Cargo to use the NDK target linker for cross-compilation
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-android.outputs.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang
        with:
          tagName: graphite-${{ github.ref_name }}
          releaseName: "Graphite v${{ github.ref_name }}"
          releaseBody: "Automated production binaries for Graphite workspace."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
